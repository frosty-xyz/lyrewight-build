name: Build Desktop Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apps:
    strategy:
      matrix:
        include:
          - os: macos-latest
            build-script: build-mac
            artifact-path: dist/Curse of the Lyre-Wight-macOS.dmg
          - os: ubuntu-latest
            build-script: build-linux
            artifact-path: dist/Curse of the Lyre-Wight-Linux.AppImage

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Build App
      run: npm run ${{ matrix.build-script }} -- --publish never

    # Temporarily save the single raw installer file
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}
        path: ${{ matrix.artifact-path }}
        compression-level: 0

  # --- RELEASE JOB ---
  publish-release:
    needs: build-apps
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the script to create a release
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-files
        merge-multiple: true # Merges files into a single flat directory

    # Creates a Draft Release with direct, raw unzipped downloads
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.3-${{ github.run_number }}
        name: Release v1.1.3 Build #${{ github.run_number }}
        draft: true
        prerelease: false
        files: |
          release-files/Curse of the Lyre-Wight-macOS.dmg
          release-files/Curse of the Lyre-Wight-Linux.AppImage
