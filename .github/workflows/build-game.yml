name: Build Desktop Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # --- MAC BUILD JOB ---
  build-mac:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Build Mac App
      run: npm run build-mac -- --publish never

    # Directly captures the target file generated by electron-builder
    - name: Upload Mac Build
      uses: actions/upload-artifact@v4
      with:
        name: lyre-wight-mac-build
        path: dist/Curse of the Lyre-Wight-macOS.dmg

  # --- LINUX BUILD JOB ---
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Build Linux App
      run: npm run build-linux -- --publish never

    # Directly captures the target file generated by electron-builder
    - name: Upload Linux Build
      uses: actions/upload-artifact@v4
      with:
        name: lyre-wight-linux-build
        path: dist/Curse of the Lyre-Wight-Linux.AppImage